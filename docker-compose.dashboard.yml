services:
  # ============================================================================
  # 1. Gluetun VPN Engine
  # ============================================================================
  gluetun:
    image: qmcgaw/gluetun:latest
    container_name: gluetun-engine
    restart: unless-stopped
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/net/tun:/dev/net/tun
    environment:
      # Provider Configuration (ProtonVPN WireGuard / OpenVPN example)
      - VPN_SERVICE_PROVIDER=${VPN_SERVICE_PROVIDER:-protonvpn}
      - VPN_TYPE=${VPN_TYPE:-openvpn}
      - OPENVPN_USER=${OPENVPN_USER:-}
      - OPENVPN_PASSWORD=${OPENVPN_PASSWORD:-}
      - WIREGUARD_PRIVATE_KEY=${WIREGUARD_PRIVATE_KEY:-}
      - SERVER_COUNTRIES=${SERVER_COUNTRIES:-India}
      - PORT_FORWARD_ONLY=${PORT_FORWARD_ONLY:-on}
      - VPN_PORT_FORWARDING=${VPN_PORT_FORWARDING:-on}
      - VPN_PORT_FORWARDING_PROVIDER=${VPN_PORT_FORWARDING_PROVIDER:-protonvpn}
      - VPN_PORT_FORWARDING_LISTENING_PORTS=8080
      - OPENVPN_MSSFIX=${OPENVPN_MSSFIX:-1200}
      - DOT=${DOT:-off}
      - DNS_UPSTREAM_RESOLVER_TYPE=${DNS_UPSTREAM_RESOLVER_TYPE:-plain}
      - DNS_PLAINTEXT_ADDRESS=${DNS_PLAINTEXT_ADDRESS:-1.1.1.1}
      # Control Server Configuration
      - HTTP_CONTROL_SERVER_LOG=${HTTP_CONTROL_SERVER_LOG:-off}
      - HTTP_CONTROL_SERVER_ADDRESS=0.0.0.0:8000
      - HTTP_CONTROL_SERVER_AUTH_DEFAULT_ROLE={"auth":"none"}
    networks:
      - vpn-management
    # Port 8000 is intentionally not exposed to the host. Proton's assigned
    # port is redirected to the namespace-local Caddy listener by Gluetun.
    healthcheck:
      test: ["CMD", "/gluetun-entrypoint", "healthcheck"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s

  # ============================================================================
  # 2. Gluetun Control Center (Dashboard)
  # ============================================================================
  dashboard:
    build:
      context: .
      dockerfile: Dockerfile.dashboard
    image: gluetun-control-center:latest
    container_name: gluetun-control-center
    restart: unless-stopped
    depends_on:
      - gluetun
    networks:
      - vpn-management
    ports:
      # Bound strictly to localhost (127.0.0.1) on host
      - "127.0.0.1:9090:9090"
    environment:
      - DASHBOARD_HTTP_ADDRESS=0.0.0.0:9090
      - DASHBOARD_AUTH_REQUIRED=${DASHBOARD_AUTH_REQUIRED:-true}
      - DASHBOARD_ADMIN_USERNAME=${DASHBOARD_ADMIN_USERNAME:-admin}
      - DASHBOARD_ADMIN_PASSWORD=${DASHBOARD_ADMIN_PASSWORD:-admin123}
      - DASHBOARD_DATA_DIR=/data
      - DASHBOARD_INTERNAL_PORT=${DASHBOARD_INTERNAL_PORT:-8080}
      - GLUETUN_CONTROL_URL=http://gluetun:8000
      - CADDY_ADMIN_URL=unix:///run/caddy/admin.sock
      - CADDY_INGRESS_URL=http://gluetun:8080
      - GLUETUN_MOCK=${GLUETUN_MOCK:-false}
      - DASHBOARD_PROXY_ALLOWED_TARGET_HOSTS=${DASHBOARD_PROXY_ALLOWED_TARGET_HOSTS:-}
      - DASHBOARD_PROXY_DENIED_TARGET_HOSTS=${DASHBOARD_PROXY_DENIED_TARGET_HOSTS:-}
      - DASHBOARD_PROXY_RESERVED_TARGET_PORTS=${DASHBOARD_PROXY_RESERVED_TARGET_PORTS:-}
      - TELEGRAM_ENABLED=${TELEGRAM_ENABLED:-false}
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN:-}
      - TELEGRAM_CHAT_ID=${TELEGRAM_CHAT_ID:-}
    volumes:
      - dashboard-data:/data
      - caddy-admin:/run/caddy
    # Hardening: Read-only root filesystem, drop all Linux capabilities
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=32m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

  # ============================================================================
  # 3. Dynamic Reverse Proxy Engine (Caddy)
  # ============================================================================
  caddy-admin-init:
    image: alpine:3.21
    container_name: gluetun-caddy-admin-init
    restart: "no"
    command: ["/bin/sh", "-ec", "mkdir -p /run/caddy /data /config && chown -R 1000:1000 /run/caddy /data /config && chmod 0700 /run/caddy"]
    volumes:
      - caddy-admin:/run/caddy
      - caddy-data:/data
      - caddy-config:/config

  caddy:
    image: caddy:2.9-alpine
    container_name: gluetun-reverse-proxy
    restart: unless-stopped
    depends_on:
      gluetun:
        condition: service_started
      caddy-admin-init:
        condition: service_completed_successfully
    user: "1000:1000"
    # Runs directly inside Gluetun's network namespace:
    # Receives redirected VPN traffic on port 8080 and proxies to local apps (:3001, :3002, etc.)
    network_mode: "service:gluetun"
    command: ["run", "--config", "/etc/caddy/Caddyfile", "--adapter", "caddyfile"]
    volumes:
      - caddy-data:/data
      - caddy-config:/config
      - caddy-admin:/run/caddy
      - ./deploy/caddy/Caddyfile:/etc/caddy/Caddyfile:ro

  # ============================================================================
  # 4. Example Application Routed Through Gluetun VPN Tunnel
  # ============================================================================
  routed-app:
    image: alpine:3.21
    container_name: gluetun-routed-app
    restart: unless-stopped
    depends_on:
      - gluetun
    # Uses the Gluetun container's network namespace (all outbound traffic passes through VPN)
    network_mode: "service:gluetun"
    command: ["/bin/sh", "-c", "while true; do sleep 3600; done"]

networks:
  vpn-management:
    name: vpn-management
    driver: bridge
    internal: false # allows dashboard to connect to gluetun

volumes:
  dashboard-data:
    name: gluetun-dashboard-data
  caddy-data:
    name: gluetun-caddy-data
  caddy-config:
    name: gluetun-caddy-config
  caddy-admin:
    name: gluetun-caddy-admin
