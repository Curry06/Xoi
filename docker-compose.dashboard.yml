services:
  # ============================================================================
  # 1. Gluetun VPN Engine
  # ============================================================================
  gluetun:
    image: qmcgaw/gluetun:latest
    container_name: gluetun-engine
    restart: unless-stopped
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/net/tun:/dev/net/tun
    environment:
      # Provider Configuration (ProtonVPN WireGuard / OpenVPN example)
      - VPN_SERVICE_PROVIDER=${VPN_SERVICE_PROVIDER:-protonvpn}
      - VPN_TYPE=${VPN_TYPE:-openvpn}
      - OPENVPN_USER=${OPENVPN_USER:-}
      - OPENVPN_PASSWORD=${OPENVPN_PASSWORD:-}
      - WIREGUARD_PRIVATE_KEY=${WIREGUARD_PRIVATE_KEY:-}
      - SERVER_COUNTRIES=${SERVER_COUNTRIES:-India}
      - PORT_FORWARD_ONLY=${PORT_FORWARD_ONLY:-on}
      - VPN_PORT_FORWARDING=${VPN_PORT_FORWARDING:-on}
      - VPN_PORT_FORWARDING_PROVIDER=${VPN_PORT_FORWARDING_PROVIDER:-protonvpn}
      - OPENVPN_MSSFIX=${OPENVPN_MSSFIX:-1200}
      - DOT=${DOT:-off}
      - DNS_UPSTREAM_RESOLVER_TYPE=${DNS_UPSTREAM_RESOLVER_TYPE:-plain}
      - DNS_PLAINTEXT_ADDRESS=${DNS_PLAINTEXT_ADDRESS:-1.1.1.1}
      # Control Server Configuration
      - HTTP_CONTROL_SERVER_LOG=${HTTP_CONTROL_SERVER_LOG:-off}
      - HTTP_CONTROL_SERVER_ADDRESS=0.0.0.0:8000
      - HTTP_CONTROL_SERVER_AUTH_DEFAULT_ROLE={"auth":"none"}
    networks:
      - vpn-management
    ports:
      # Forwarded port forwarded from VPN to internal service (example port: 8080)
      - "8080:8080"
      # IMPORTANT SECURITY REQUIREMENT:
      # Port 8000 (Gluetun Control Server) is INTENTIONALLY NOT EXPOSED to the host!
      # It is accessible strictly via the internal 'vpn-management' Docker bridge network.
    healthcheck:
      test: ["CMD", "/gluetun-entrypoint", "healthcheck"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s

  # ============================================================================
  # 2. Gluetun Control Center (Dashboard)
  # ============================================================================
  dashboard:
    build:
      context: .
      dockerfile: Dockerfile.dashboard
    image: gluetun-control-center:latest
    container_name: gluetun-control-center
    restart: unless-stopped
    depends_on:
      - gluetun
    networks:
      - vpn-management
    ports:
      # Bound strictly to localhost (127.0.0.1) on host
      - "127.0.0.1:9090:9090"
    environment:
      - DASHBOARD_HTTP_ADDRESS=0.0.0.0:9090
      - DASHBOARD_AUTH_REQUIRED=${DASHBOARD_AUTH_REQUIRED:-true}
      - DASHBOARD_ADMIN_USERNAME=${DASHBOARD_ADMIN_USERNAME:-admin}
      - DASHBOARD_ADMIN_PASSWORD=${DASHBOARD_ADMIN_PASSWORD:-admin123}
      - DASHBOARD_DATA_DIR=/data
      - DASHBOARD_INTERNAL_PORT=${DASHBOARD_INTERNAL_PORT:-8080}
      - GLUETUN_CONTROL_URL=http://gluetun:8000
      - GLUETUN_MOCK=${GLUETUN_MOCK:-false}
      - TELEGRAM_ENABLED=${TELEGRAM_ENABLED:-false}
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN:-}
      - TELEGRAM_CHAT_ID=${TELEGRAM_CHAT_ID:-}
    volumes:
      - dashboard-data:/data
    # Hardening: Read-only root filesystem, drop all Linux capabilities
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=32m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

  # ============================================================================
  # 3. Example Application Routed Through Gluetun VPN Tunnel
  # ============================================================================
  routed-app:
    image: alpine:3.21
    container_name: gluetun-routed-app
    restart: unless-stopped
    depends_on:
      - gluetun
    # Uses the Gluetun container's network namespace (all outbound traffic passes through VPN)
    network_mode: "service:gluetun"
    command: ["/bin/sh", "-c", "while true; do sleep 3600; done"]

networks:
  vpn-management:
    name: vpn-management
    driver: bridge
    internal: false # allows dashboard to connect to gluetun

volumes:
  dashboard-data:
    name: gluetun-dashboard-data
